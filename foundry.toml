[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
bytecode_hash = "none"
gas_limit = "3000000000"

[profile.default.fuzz]
runs = 64

[fmt]
line_length = 120
